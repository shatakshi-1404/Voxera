# NOTE: written but not executed by the author. First CI run may need small tweaks.
name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: voxera, POSTGRES_PASSWORD: voxera, POSTGRES_DB: voxera }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voxera" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://voxera:voxera@localhost:5432/voxera
      RATE_LIMIT_ENABLED: "false"
      JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Seed and start API
        run: |
          python -m scripts.seed
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
      - name: Conversation evals (gate: all safety cases + 90% overall)
        run: python -m evals.run_evals --fail-under 0.90
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: backend/evals/report.md }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: voxera, POSTGRES_PASSWORD: voxera, POSTGRES_DB: voxera }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voxera" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://voxera:voxera@localhost:5432/voxera
      RATE_LIMIT_ENABLED: "false"
      JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r backend/requirements.txt
      - name: Seed and start API
        working-directory: backend
        run: |
          python -m scripts.seed
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          CI=1 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }
